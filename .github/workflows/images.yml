name: Images

# Baut die Container-Images und legt sie in GHCR ab (ghcr.io/<owner>/formularportal-{backend,frontend,mcp}).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: formularportal-backend
            context: backend
            file: backend/Dockerfile
          - name: formularportal-frontend
            context: frontend
            file: frontend/Dockerfile
          - name: formularportal-mcp
            context: .
            file: Dockerfile.mcp
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
